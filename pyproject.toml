[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-checker"
version = "1.0.0"
description = "Local tool for importing and checking certified OS components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "sqlalchemy>=2.0.35",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.2",
    "pytest>=8.3.2",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "PyYAML>=6.0.2",
]

[tool.setuptools]
packages = ["app"]
